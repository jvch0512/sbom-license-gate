name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build
        run: mkdir -p out && javac -d out src/main/java/gate/*.java src/test/java/gate/*.java
      - name: Tests
        run: java -cp out gate.GateTest
      - name: Sample outputs are up to date
        run: |
          java -cp out gate.Main examples/sbom.json --fail-on denied > /tmp/s.txt || true
          diff /tmp/s.txt docs/sample-output.txt
          java -cp out gate.Main examples/sbom.json --html > /tmp/s.html
          diff /tmp/s.html site/index.html
